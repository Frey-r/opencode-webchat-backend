version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/opencode_webchat?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRY=24h
      - JWT_COOKIE_NAME=owc_token
      - OPENCODE_BINARY=opencode
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /home/pi/projects:/home/pi/projects:ro
      - opencode-data:/data

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=opencode_webchat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  opencode-data: